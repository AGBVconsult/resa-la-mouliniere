<title>La Moulinière Desktop</title>
<style>
/* Layout: macOS window — titlebar, icon rail + grey sidebar, white rounded main panel with centered segmented control */
:root {
  --chrome: #f7f7f7;        /* window, rail and sidebar ground */
  --panel: #ffffff;         /* main content panel */
  --ink: #0d0d0d;
  --ink-2: #5d5d5d;
  --ink-3: #8f8f8f;
  --hover: #ececec;
  --line: #e6e6e6;
  --field: #ffffff;
  --seg: #f1f1f1;
  --seg-on: #ffffff;
  --blue: #2f7cf6;
  --orange: #e8670c;
  --red: #ef4444;
  --green: #10b981;
  --grey-dot: #c7c7c7;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 24px rgba(0,0,0,.06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome: #181818; --panel: #212121; --ink: #ececec; --ink-2: #b4b4b4; --ink-3: #8a8a8a;
    --hover: #2a2a2a; --line: #333333; --field: #2b2b2b; --seg: #2b2b2b; --seg-on: #3d3d3d;
    --blue: #3b8bff; --orange: #ff8a3d; --red: #f87171; --green: #34d399; --grey-dot: #5a5a5a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chrome: #181818; --panel: #212121; --ink: #ececec; --ink-2: #b4b4b4; --ink-3: #8a8a8a;
  --hover: #2a2a2a; --line: #333333; --field: #2b2b2b; --seg: #2b2b2b; --seg-on: #3d3d3d;
  --blue: #3b8bff; --orange: #ff8a3d; --red: #f87171; --green: #34d399; --grey-dot: #5a5a5a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--chrome); color: var(--ink); font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; padding-inline: 16px; padding-block: 16px; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

.window { max-width: 1440px; height: 100%; min-height: 640px; margin: 0 auto; background: var(--chrome); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); display: grid; grid-template-rows: 44px 1fr; overflow: hidden; }

/* Titlebar */
.titlebar { display: flex; align-items: center; gap: 18px; padding: 0 14px; color: var(--ink-3); }
.lights { display: flex; gap: 8px; }
.lights span { width: 12px; height: 12px; border-radius: 50%; }
.lights span:nth-child(1) { background: #ff5f57; } .lights span:nth-child(2) { background: #febc2e; } .lights span:nth-child(3) { background: #28c840; }
.tb-btn { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; color: var(--ink-3); }
.tb-btn:hover { background: var(--hover); color: var(--ink); }
.titlebar .spacer { flex: 1; }

.frame { display: grid; grid-template-columns: 52px 296px 1fr; min-height: 0; }
.frame.collapsed { grid-template-columns: 52px 0 1fr; }
.frame.collapsed .sidebar { visibility: hidden; }

/* Icon rail */
.rail { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 6px; padding-bottom: 14px; }
.rail-btn { position: relative; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; color: var(--ink-2); }
.rail-btn:hover { background: var(--hover); color: var(--ink); }
.rail-btn.on { background: var(--hover); color: var(--ink); }
.rail-btn .badge-dot { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); border: 2px solid var(--chrome); }
.rail .grow { flex: 1; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--orange); color: #fff; font-size: 10px; font-weight: 600; display: grid; place-items: center; letter-spacing: .02em; }

/* Sidebar */
.sidebar { display: flex; flex-direction: column; min-width: 0; overflow: hidden; padding: 4px 10px 0 8px; }
.sb-head { display: flex; align-items: center; padding: 6px 10px 10px; gap: 4px; }
.sb-title { font-size: 19px; font-weight: 600; display: flex; align-items: center; gap: 4px; color: var(--ink); }
.sb-title svg { width: 14px; height: 14px; color: var(--ink-3); }
.sb-head .spacer { flex: 1; }
.sb-icon { position: relative; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: var(--ink-2); }
.sb-icon:hover { background: var(--hover); }
.sb-icon .badge-dot { position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
.sb-scroll { overflow-y: auto; flex: 1; padding-bottom: 16px; scrollbar-width: thin; }
.sb-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; font-size: 14.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-item:hover { background: var(--hover); }
.sb-item.on { background: var(--hover); }
.sb-item .meta { margin-left: auto; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sb-item .txt { overflow: hidden; text-overflow: ellipsis; }
.sb-item.sub { padding-left: 38px; }
.sb-item.muted { color: var(--ink-3); }
.sb-label { font-size: 14.5px; color: var(--ink-2); padding: 18px 10px 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.confirmed, .dot.seated { background: var(--green); }
.dot.pending { background: var(--orange); animation: pulse 1.6s ease-in-out infinite; }
.dot.cancelled { background: var(--red); }
.dot.finished { background: var(--grey-dot); }
@keyframes pulse { 50% { opacity: .35; } }

/* Main panel */
.main { background: var(--panel); border-top-left-radius: 10px; border-left: 1px solid var(--line); border-top: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.main-top { display: flex; justify-content: center; padding: 12px 16px 0; }
.seg { display: inline-flex; background: var(--seg); border-radius: 999px; padding: 3px; }
.seg button { padding: 7px 26px; border-radius: 999px; font-size: 14.5px; color: var(--ink-2); transition: background .15s, color .15s; }
.seg button.on { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); font-weight: 500; }
.view { flex: 1; min-height: 0; overflow-y: auto; }

/* Home view */
.home { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 20px 48px; }
.home h1 { font-size: 30px; font-weight: 500; letter-spacing: -.01em; margin: 0 0 28px; text-align: center; text-wrap: balance; }
.composer-wrap { width: 100%; max-width: 740px; }
.composer { background: var(--field); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 14px 14px 10px; position: relative; z-index: 1; }
.composer input { width: 100%; border: 0; outline: none; background: transparent; font: inherit; font-size: 15.5px; color: var(--ink); padding: 2px 2px 18px; }
.composer input::placeholder { color: var(--ink-3); }
.c-row { display: flex; align-items: center; gap: 12px; }
.c-row .spacer { flex: 1; }
.c-plus { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); }
.c-plus:hover { background: var(--hover); }
.c-warn { display: inline-flex; align-items: center; gap: 6px; color: var(--orange); font-size: 14.5px; }
.c-warn svg { width: 15px; height: 15px; }
.c-model { display: inline-flex; align-items: center; gap: 6px; font-size: 14.5px; color: var(--ink); padding: 4px 8px; border-radius: 8px; }
.c-model:hover { background: var(--hover); }
.c-model .soft { color: var(--ink-3); }
.c-model svg { width: 13px; height: 13px; color: var(--ink-3); }
.c-mic { color: var(--ink-2); display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; }
.c-mic:hover { background: var(--hover); }
.c-send { width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; }
.c-send svg { width: 17px; height: 17px; stroke-width: 2.2; }
.chips { display: flex; align-items: center; gap: 6px; margin: -12px 16px 0; padding: 20px 10px 8px; background: var(--seg); border-radius: 0 0 16px 16px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 8px; font-size: 14.5px; color: var(--ink); }
.chip:hover { background: var(--hover); }
.chip svg { width: 16px; height: 16px; }
.chips .spacer { flex: 1; }
.suggest { width: 100%; max-width: 700px; margin-top: 30px; display: flex; flex-direction: column; gap: 2px; }
.sugg { display: flex; align-items: center; gap: 18px; padding: 11px 12px; border-radius: 10px; color: var(--ink-2); text-align: left; font-size: 14.5px; }
.sugg:hover { background: var(--hover); color: var(--ink); }
.sugg .mark { width: 16px; display: grid; place-items: center; flex-shrink: 0; }
.sugg .bar { width: 3px; height: 15px; border-radius: 2px; background: var(--red); }
.sugg svg { width: 16px; height: 16px; color: var(--ink-3); }
.sugg .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpis { display: flex; gap: 28px; margin-top: 34px; color: var(--ink-3); font-size: 13px; flex-wrap: wrap; justify-content: center; font-variant-numeric: tabular-nums; }
.kpis b { color: var(--ink); font-weight: 600; font-size: 15px; margin-right: 4px; }

/* Reservations view */
.resa { display: flex; flex-direction: column; min-height: 100%; }
.resa-head { display: flex; align-items: center; gap: 8px; padding: 22px 28px 6px; flex-wrap: wrap; }
.date-btn { font-size: 26px; font-weight: 400; letter-spacing: -.01em; padding: 2px 6px; border-radius: 8px; }
.date-btn:hover { background: var(--hover); }
.round { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
.round:hover { background: var(--hover); color: var(--ink); }
.resa-head .spacer { flex: 1; }
.pill-btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 13.5px; color: var(--ink); background: var(--panel); }
.pill-btn:hover { background: var(--hover); }
.pill-btn.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.pill-btn svg { width: 15px; height: 15px; }
.summary { display: flex; gap: 20px; padding: 0 34px 14px; color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.summary b { color: var(--ink); font-weight: 600; }
.resa-body { flex: 1; display: flex; gap: 20px; padding: 0 22px 120px; min-height: 0; }
.list { flex: 1; min-width: 0; }
.group-label { font-size: 13.5px; color: var(--ink-2); padding: 16px 12px 6px; display: flex; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; }
.group-label .cap { font-size: 12px; color: var(--ink-3); }
.row { display: grid; grid-template-columns: 12px 46px minmax(120px, 1.3fr) 54px 44px 52px minmax(0, 2fr); align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; width: 100%; text-align: left; font-variant-numeric: tabular-nums; }
.row:hover { background: var(--hover); }
.row.open { background: var(--hover); border-radius: 10px 10px 0 0; }
.row.done { opacity: .55; }
.row .time { color: var(--ink-2); font-size: 13.5px; }
.row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .name .first { color: var(--ink-2); }
.row .name .last { font-weight: 600; }
.row .pax { font-weight: 600; }
.row .pax small { font-weight: 400; color: var(--ink-3); font-size: 11.5px; margin-left: 2px; }
.row .tbl { font-size: 12.5px; color: var(--ink-2); }
.row .tbl.none { color: var(--ink-3); }
.visit { justify-self: start; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; color: #fff; background: #2563eb; }
.visit.new { background: #059669; }
.row .note { color: var(--ink-3); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 12px 12px 82px; background: var(--hover); border-radius: 0 0 10px 10px; margin-bottom: 4px; }
.act { padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.act:hover { border-color: var(--ink-3); }
.act .dot { width: 7px; height: 7px; }

.floor { width: 330px; flex-shrink: 0; align-self: flex-start; position: sticky; top: 12px; margin-top: 16px; padding: 14px; border-radius: 16px; background: var(--chrome); }
.floor-title { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--ink-2); margin-bottom: 12px; }
.floor-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tbl-cell { height: 64px; min-width: 0; padding: 0 6px; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tbl-cell b { font-size: 13.5px; color: var(--ink); font-weight: 600; }
.tbl-cell.busy { background: var(--ink); border-color: var(--ink); color: var(--ink-3); }
.tbl-cell.busy b { color: var(--panel); }
.tbl-cell.wide { grid-column: span 2; }
.tbl-cell span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbl-cell.hl { outline: 2px solid var(--blue); outline-offset: 2px; }

.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 18px; background: linear-gradient(to bottom, transparent, var(--panel) 40%); display: flex; justify-content: center; pointer-events: none; }
.dock .composer { pointer-events: auto; width: 100%; max-width: 740px; padding: 10px 10px 10px 14px; }
.dock .composer .c-row input { padding: 0; flex: 1; min-width: 0; }

.placeholder { padding: 80px 28px; text-align: center; color: var(--ink-3); }
.placeholder h2 { color: var(--ink); font-weight: 500; font-size: 22px; margin: 0 0 8px; }

.toast { position: absolute; left: 50%; top: 62px; transform: translateX(-50%) translateY(-8px); background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 999px; font-size: 13.5px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.mobile-toggle { display: none; }
.scrim { display: none; }

@media (max-width: 1100px) {
  .floor { display: none; }
  .row { grid-template-columns: 12px 46px minmax(110px, 1.3fr) 48px 40px 48px minmax(0, 1.4fr); }
}
@media (max-width: 760px) {
  body { padding-inline: 16px; padding-block: 12px; }
  .window { min-height: 0; }
  .frame, .frame.collapsed { grid-template-columns: 0 1fr; }
  .rail { display: none; }
  .titlebar .tb-nav { display: none; }
  .mobile-toggle { display: grid; }
  .sidebar { position: absolute; z-index: 30; top: 44px; bottom: 0; left: 0; width: min(296px, 85%); background: var(--chrome); transform: translateX(-100%); transition: transform .2s; visibility: visible !important; border-right: 1px solid var(--line); }
  .window { position: relative; }
  .frame.drawer .sidebar { transform: none; }
  .frame.drawer .scrim { display: block; position: absolute; inset: 44px 0 0 0; background: rgba(0,0,0,.3); z-index: 25; }
  .main { border-left: 0; border-top-left-radius: 0; grid-column: 2; }
  .home h1 { font-size: 24px; }
  .resa-head { padding: 16px 12px 4px; }
  .date-btn { font-size: 20px; }
  .summary { padding: 0 18px 10px; }
  .resa-body { padding: 0 6px 120px; }
  .row { grid-template-columns: 10px 40px minmax(0, 1fr) 30px 38px; gap: 8px; }
  .row .visit, .row .note { display: none; }
  .actions { padding-left: 12px; }
  .seg button { padding: 6px 18px; }
  .chips .spacer, .chips .chip-icon-only { display: none; }
  .c-warn .long { display: none; }
}
@media (prefers-reduced-motion: reduce) { .dot.pending { animation: none; } * { transition: none !important; } }
</style>

<div class="window">
  <div class="titlebar">
    <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>
    <button class="tb-btn mobile-toggle" id="drawerBtn" title="Menu" aria-label="Ouvrir le menu" data-icon="menu"></button>
    <button class="tb-btn tb-nav" title="Précédent" data-icon="arrowLeft"></button>
    <button class="tb-btn tb-nav" title="Suivant" data-icon="arrowRight"></button>
    <button class="tb-btn tb-nav" id="collapseBtn" title="Rétracter la barre latérale" data-icon="panel"></button>
    <div class="spacer"></div>
    <button class="tb-btn" title="Nouvelle fenêtre" data-icon="window"></button>
  </div>

  <div class="frame" id="frame">
    <nav class="rail" id="rail" aria-label="Navigation principale"></nav>
    <aside class="sidebar" id="sidebar">
      <div class="sb-head">
        <button class="sb-title">La Moulinière <span data-icon="chevDown"></span></button>
        <div class="spacer"></div>
        <button class="sb-icon" title="Notifications" id="bellBtn"><span data-icon="bell"></span><span class="badge-dot"></span></button>
        <button class="sb-icon" title="Rechercher" id="searchBtn" data-icon="search"></button>
      </div>
      <div class="sb-scroll" id="sbScroll"></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="main">
      <div class="main-top">
        <div class="seg" role="tablist" aria-label="Service">
          <button role="tab" id="segLunch" data-svc="lunch">Midi</button>
          <button role="tab" id="segDinner" data-svc="dinner">Soir</button>
        </div>
      </div>
      <div class="view" id="view"></div>
      <div class="toast" id="toast"></div>
    </main>
  </div>
</div>

const ic = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;

// Example data — illustrative only
const DATA = {

const SERVICE = { lunch: { name: 'Déjeuner', hours: '12:00–14:30', cap: 40 }, dinner: { name: 'Dîner', hours: '18:30–22:00', cap: 56 } };
const TABLES = [['T1',2],['T2',2],['T3',2],['T4',2],['T5',4],['T6',4],['T7',4],['T8',4],['T9',4],['T10',8,true],['T11',6,true]];
const NAV = [
  { key: 'home', name: 'Tableau de bord', icon: 'home' },
  { key: 'resa', name: 'Réservations', icon: 'calendarDays' },
  { key: 'planning', name: 'Planning', icon: 'calendar' },
  { key: 'floor', name: 'Plan de salle', icon: 'grid' },
  { key: 'clients', name: 'Clients', icon: 'users' },
  { key: 'stats', name: 'Statistiques', icon: 'chart' },
];

const state = { view: 'home', svc: 'dinner', date: new Date(2026, 9, 6), open: null, floor: true, hl: null, collapsed: false };
const $ = (s) => document.querySelector(s);
const STATUS_LABEL = { confirmed: 'Confirmé', seated: 'Arrivé', pending: 'En attente', cancelled: 'Annulé', finished: 'Terminé' };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2000); }
const active = (list) => list.filter(r => r.s !== 'cancelled');
const covers = (list) => active(list).reduce((a, r) => a + r.p, 0);
const pendingAll = () => [...DATA.dinner.map(r => ({ ...r, svc: 'dinner' })), ...DATA.lunch.map(r => ({ ...r, svc: 'lunch' }))].filter(r => r.s === 'pending');
const fmtDate = (d) => { const x = new Intl.DateTimeFormat('fr-BE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(d); return x.charAt(0).toUpperCase() + x.slice(1); };

function renderRail() {
  const pend = pendingAll().length;
  $('#rail').innerHTML = NAV.map(n => `<button class="rail-btn ${state.view === n.key ? 'on' : ''}" data-nav="${n.key}" title="${n.name}" aria-label="${n.name}">${ic(n.icon)}${n.key === 'resa' && pend ? '<span class="badge-dot"></span>' : ''}</button>`).join('')
    + `<button class="rail-btn" title="Plus" aria-label="Plus">${ic('more')}</button><div class="grow"></div><div class="avatar" title="Administrateur">LM</div>`;
}

function renderSidebar() {
  const pend = pendingAll();
  const recents = [...DATA.dinner, ...DATA.lunch].slice().sort((a, b) => b.id - a.id).slice(0, 12);
  $('#sbScroll').innerHTML = `
    <button class="sb-item" data-act="new">${ic('edit')}<span class="txt">Nouvelle réservation</span></button>
    <div class="sb-label">En attente</div>
    ${pend.map(r => `<button class="sb-item" data-goto="${r.id}" data-svc="${r.svc}"><span class="dot pending"></span><span class="txt">${r.l} · ${r.p} pers.</span><span class="meta">${r.t}</span></button>`).join('')}
    <div class="sb-label">Services</div>
    <button class="sb-item ${state.view === 'resa' && state.svc === 'lunch' ? 'on' : ''}" data-svcnav="lunch">${ic('folder')}<span class="txt">Déjeuner</span><span class="meta">${covers(DATA.lunch)} couv.</span></button>
    <button class="sb-item ${state.view === 'resa' && state.svc === 'dinner' ? 'on' : ''}" data-svcnav="dinner">${ic('folder')}<span class="txt">Dîner</span><span class="meta">${covers(DATA.dinner)} couv.</span></button>
    <button class="sb-item sub" data-nav="creneaux"><span class="txt">Créneaux</span></button>
    <button class="sb-item sub" data-nav="periodes"><span class="txt">Périodes</span></button>
    <button class="sb-item ${state.view === 'floor' ? 'on' : ''}" data-nav="floor">${ic('grid')}<span class="txt">Plan de salle</span></button>
    <button class="sb-item ${state.view === 'settings' ? 'on' : ''}" data-nav="settings">${ic('sliders')}<span class="txt">Paramètres</span></button>
    <button class="sb-item muted" data-nav="settings"><span class="txt">Afficher plus</span></button>
    <div class="sb-label">Récents</div>
    ${recents.map(r => `<button class="sb-item" data-goto="${r.id}" data-svc="${DATA.lunch.includes(r) ? 'lunch' : 'dinner'}"><span class="txt">${r.f} ${r.l} — ${r.p} pers. ${r.t}</span></button>`).join('')}
  `;
}

function renderSeg() {
  $('#segLunch').classList.toggle('on', state.svc === 'lunch');
  $('#segDinner').classList.toggle('on', state.svc === 'dinner');
  $('#segLunch').setAttribute('aria-selected', state.svc === 'lunch');
  $('#segDinner').setAttribute('aria-selected', state.svc === 'dinner');
}

function composer(id, placeholder, docked) {
  const pend = pendingAll().length;
  const svc = SERVICE[state.svc];
  if (docked) return `<form class="composer" data-form="${id}"><div class="c-row">
      <button type="button" class="c-plus" title="Options" data-act="new">${ic('plus')}</button>
      <input id="${id}" autocomplete="off" placeholder="${placeholder}" aria-label="${placeholder}">
      <button type="button" class="c-mic" title="Dicter">${ic('mic')}</button>
      <button class="c-send" title="Ajouter">${ic('arrowUp')}</button></div></form>`;
  return `<form class="composer" data-form="${id}">
      <input id="${id}" autocomplete="off" placeholder="${placeholder}" aria-label="${placeholder}">
      <div class="c-row">
        <button type="button" class="c-plus" title="Nouvelle réservation" data-act="new">${ic('plus')}</button>
        ${pend ? `<button type="button" class="c-warn" data-nav="resa">${ic('alert')}${pend}<span class="long">&nbsp;en attente de confirmation</span></button>` : ''}
        <div class="spacer"></div>
        <button type="button" class="c-model" data-toggle-svc>${svc.name} <span class="soft">${svc.hours}</span>${ic('chevDown')}</button>
        <button type="button" class="c-mic" title="Dicter">${ic('mic')}</button>
        <button class="c-send" title="Ajouter">${ic('wave')}</button>
      </div></form>`;
}

function renderHome() {
  const list = DATA[state.svc];
  const pend = pendingAll();
  const sugg = [
    ...pend.map(r => ({ mark: '<span class="bar"></span>', txt: `${r.f} ${r.l} attend une confirmation : ${r.p} pers. à ${r.t} (${SERVICE[r.svc].name.toLowerCase()})`, goto: r.id, svc: r.svc })),
    { mark: ic('calendar'), txt: 'Jeudi 8 octobre : groupe de 14 personnes, prévoir la grande salle', nav: 'planning' },
    { mark: ic('mail'), txt: 'Envoyer les demandes d’avis aux clients d’hier soir (18 couverts)', nav: 'stats' },
  ];
  $('#view').innerHTML = `<section class="home">
    <h1>Sur quel service travaillez-vous ?</h1>
    <div class="composer-wrap">
      ${composer('homeInput', 'Rechercher un client ou ajouter « Dupont 4p 20h »')}
      <div class="chips">
        <button class="chip" data-nav="planning">${ic('calendar')}Choisir une date</button>
        <button class="chip" data-nav="floor">${ic('grid')}Plan de salle</button>
        <button class="chip" data-act="import">${ic('upload')}Importer</button>
        <div class="spacer"></div>
        <button class="chip chip-icon-only" title="Mode tablette">${ic('laptop')}</button>
      </div>
    </div>
    <div class="suggest">${sugg.map(s => `<button class="sugg" ${s.goto ? `data-goto="${s.goto}" data-svc="${s.svc}"` : `data-nav="${s.nav}"`}><span class="mark">${s.mark}</span><span class="txt">${s.txt}</span></button>`).join('')}</div>
    <div class="kpis">
      <span><b>${active(list).length}</b>réservations</span>
      <span><b>${covers(list)}</b>/ ${SERVICE[state.svc].cap} couverts</span>
      <span><b>${list.filter(r => r.v === 0).length}</b>nouveaux clients</span>
      <span><b>${list.filter(r => r.s === 'cancelled').length}</b>annulation</span>
    </div>
  </section>`;
}

function rowHTML(r) {
  const kids = (r.c || r.b) ? `<small>(${r.c ? r.c + 'e' : ''}${r.c && r.b ? '+' : ''}${r.b ? r.b + 'b' : ''})</small>` : '';
  const done = r.s === 'cancelled' || r.s === 'finished';
  let h = `<button class="row ${state.open === r.id ? 'open' : ''} ${done ? 'done' : ''}" data-row="${r.id}" aria-expanded="${state.open === r.id}">
    <span class="dot ${r.s}" title="${STATUS_LABEL[r.s]}"></span>
    <span class="time">${r.t}</span>
    <span class="name"><span class="first">${r.f}</span> <span class="last">${r.l}</span></span>
    <span class="pax">${r.p}${kids}</span>
    <span class="tbl ${r.tbl ? '' : 'none'}">${r.tbl || '—'}</span>
    <span class="visit ${r.v === 0 ? 'new' : ''}">${r.v === 0 ? 'New' : r.v}</span>
    <span class="note">${r.n || '–'}</span></button>`;
  if (state.open === r.id) {
    h += `<div class="actions">
      ${['confirmed', 'seated', 'finished', 'cancelled'].filter(s => s !== r.s).map(s => `<button class="act" data-status="${s}" data-id="${r.id}"><span class="dot ${s}"></span>${{ confirmed: 'Confirmer', seated: 'Marquer arrivé', finished: 'Terminer', cancelled: 'Annuler' }[s]}</button>`).join('')}
      <button class="act" data-assign="${r.id}">${ic('grid')}Assigner une table</button>
    </div>`;
  }
  return h;
}

function floorHTML(list) {
  const used = {};
  active(list).forEach(r => { if (r.tbl) used[r.tbl] = r; });
  return `<div class="floor-grid">${TABLES.map(([t, seats, wide]) => {
    const r = used[t];
    return `<div class="tbl-cell ${wide ? 'wide' : ''} ${r ? 'busy' : ''} ${state.hl && r && r.id === state.hl ? 'hl' : ''}"><b>${t}</b><span>${r ? r.l + ' · ' + r.p : seats + ' places'}</span></div>`;
  }).join('')}</div>`;
}

function renderResa() {
  const list = DATA[state.svc];
  const groups = {};
  list.forEach(r => (groups[r.t] = groups[r.t] || []).push(r));
  const pend = list.filter(r => r.s === 'pending').length;
  $('#view').innerHTML = `<section class="resa">
    <div class="resa-head">
      <button class="round" data-day="-1" title="Jour précédent">${ic('chevLeft')}</button>
      <button class="date-btn" data-day="0" title="Revenir à aujourd’hui">${fmtDate(state.date)}</button>
      <button class="round" data-day="1" title="Jour suivant">${ic('chevRight')}</button>
      <div class="spacer"></div>
      <button class="pill-btn ${state.floor ? 'on' : ''}" data-act="floor">${ic('map')}Plan</button>
      <button class="pill-btn" data-act="new">${ic('plus')}Réservation</button>
    </div>
    <div class="summary">
      <span><b>${covers(list)}</b> / ${SERVICE[state.svc].cap} couverts</span>
      <span><b>${active(list).length}</b> réservations</span>
      ${pend ? `<span style="color:var(--orange)"><b style="color:inherit">${pend}</b> en attente</span>` : ''}
      <span>${SERVICE[state.svc].name} · ${SERVICE[state.svc].hours}</span>
    </div>
    <div class="resa-body">
      <div class="list">${Object.keys(groups).sort().map(t => `<div class="group-label">${t}<span class="cap">${covers(groups[t])} couverts</span></div>${groups[t].map(rowHTML).join('')}`).join('')}</div>
      ${state.floor ? `<aside class="floor"><div class="floor-title"><span>Plan de salle</span><span>${Object.keys(active(list).reduce((o, r) => (r.tbl && (o[r.tbl] = 1), o), {})).length} / ${TABLES.length} tables</span></div>${floorHTML(list)}</aside>` : ''}
    </div>
  </section>
  <div class="dock">${composer('dockInput', 'Ajouter une réservation, ex. « Dupont 4p 20h30 »', true)}</div>`;
}

function renderFloor() {
  $('#view').innerHTML = `<section class="resa"><div class="resa-head"><span class="date-btn" style="cursor:default">Plan de salle</span></div>
    <div class="summary"><span>${SERVICE[state.svc].name} · ${fmtDate(state.date)}</span></div>
    <div style="padding:8px 28px 40px;max-width:640px">${floorHTML(DATA[state.svc])}</div></section>`;
}

function renderPlaceholder(name) {
  $('#view').innerHTML = `<div class="placeholder"><h2>${name}</h2><p>Cet écran garde sa structure actuelle. La preview se concentre sur le tableau de bord, les réservations et le plan de salle.</p></div>`;
}

function render() {
  renderRail(); renderSidebar(); renderSeg();
  if (state.view === 'home') renderHome();
  else if (state.view === 'resa') renderResa();
  else if (state.view === 'floor') renderFloor();
  else renderPlaceholder({ planning: 'Planning', clients: 'Clients', stats: 'Statistiques', settings: 'Paramètres', creneaux: 'Créneaux', periodes: 'Périodes' }[state.view] || 'Écran');
}

function go(view) { state.view = view; state.open = null; $('#frame').classList.remove('drawer'); render(); $('#view').scrollTop = 0; }

function addFromText(txt) {
  const m = txt.match(/^\s*([A-Za-zÀ-ÿ' -]+?)\s+(\d{1,2})\s*p(?:ers)?\.?\s+(\d{1,2})\s*[h:]\s*(\d{2})?\s*$/i);
  if (!m) {
    const q = txt.trim().toLowerCase();
    const hit = [...DATA.dinner, ...DATA.lunch].find(r => (r.f + ' ' + r.l).toLowerCase().includes(q));
    if (q && hit) { state.svc = DATA.lunch.includes(hit) ? 'lunch' : 'dinner'; state.open = hit.id; state.hl = hit.id; state.view = 'resa'; render(); return; }
    toast('Format attendu : Nom 4p 20h30');
    return;
  }
  const hh = +m[3], mm = m[4] || '00';
  const svc = hh < 16 ? 'lunch' : 'dinner';
  const name = m[1].trim();
  const r = { id: Date.now(), t: `${String(hh).padStart(2, '0')}:${mm}`, f: '', l: name.charAt(0).toUpperCase() + name.slice(1), p: +m[2], tbl: '', v: 0, s: 'pending', n: 'Ajoutée depuis la barre rapide' };
  DATA[svc].push(r);
  state.svc = svc; state.view = 'resa'; state.open = r.id;
  render();
  toast(`Réservation ajoutée : ${r.l}, ${r.p} pers. à ${r.t}`);
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button, .scrim');
  if (!b) return;
  if (b.id === 'scrim') return $('#frame').classList.remove('drawer');
  if (b.id === 'drawerBtn') return $('#frame').classList.toggle('drawer');
  if (b.id === 'collapseBtn') { state.collapsed = !state.collapsed; $('#frame').classList.toggle('collapsed', state.collapsed); return; }
  if (b.id === 'bellBtn') return go('resa');
  if (b.id === 'searchBtn') { go('home'); $('#homeInput')?.focus(); return; }
  if (b.dataset.svc && b.closest('.seg')) { state.svc = b.dataset.svc; state.open = null; return render(); }
  if (b.dataset.nav) return go(b.dataset.nav);
  if (b.dataset.svcnav) { state.svc = b.dataset.svcnav; return go('resa'); }
  if (b.dataset.goto) { state.svc = b.dataset.svc; state.view = 'resa'; state.open = +b.dataset.goto; state.hl = +b.dataset.goto; $('#frame').classList.remove('drawer'); return render(); }
  if (b.hasAttribute('data-toggle-svc')) { state.svc = state.svc === 'lunch' ? 'dinner' : 'lunch'; return render(); }
  if (b.dataset.row) { const id = +b.dataset.row; state.open = state.open === id ? null : id; state.hl = id; return render(); }
  if (b.dataset.status) {
    const r = DATA[state.svc].find(x => x.id === +b.dataset.id); r.s = b.dataset.status; state.open = null; render();
    return toast(`${r.l} : ${STATUS_LABEL[r.s].toLowerCase()}`);
  }
  if (b.dataset.assign) {
    const r = DATA[state.svc].find(x => x.id === +b.dataset.assign);
    const used = new Set(active(DATA[state.svc]).map(x => x.tbl));
    const free = TABLES.find(([t, seats]) => !used.has(t) && seats >= r.p);
    if (!free) return toast('Aucune table libre assez grande');
    r.tbl = free[0]; state.floor = true; render(); return toast(`${r.l} placé en ${free[0]}`);
  }
  if (b.dataset.day !== undefined) {
    const d = +b.dataset.day;
    state.date = d === 0 ? new Date(2026, 9, 6) : new Date(state.date.getFullYear(), state.date.getMonth(), state.date.getDate() + d);
    return render();
  }
  const act = b.dataset.act;
  if (act === 'floor') { state.floor = !state.floor; return render(); }
  if (act === 'new') { if (state.view !== 'resa') go('resa'); $('#dockInput')?.focus(); return; }
  if (act === 'import') return toast('Import : glissez un fichier CSV de réservations');
});

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const input = e.target.querySelector('input');
  if (!input.value.trim()) { input.focus(); return; }
  addFromText(input.value); input.value = '';
});

render();
</script>
